# FronyBrowser 정책
#
# 이 파일은 예시다. 실제 정책은 WALLET_DATA_DIR\policy.toml (기본) 또는 WALLET_POLICY가 가리키는 파일이며 커밋하지 않는다.
# 값은 절대 넣지 않는다 — 키 이름과 도메인만.
# 정책은 서버 측에만 존재한다. 호출자(에이전트)는 볼 수도, 뒤집을 수도 없다.
# 호출자(에이전트 기기)가 침해됐을 때 피해를 제한하는 것이 이 파일이므로,
# 호출자에게 이 파일에 대한 쓰기 권한을 주지 않는다.
#
# ── 해석 규칙 (전부 fail-closed) ─────────────────────────────
#  * 여기 없는 키는 거부된다. 금고에 값이 있어도 마찬가지다.
#  * allow_origins가 비었거나 없으면 거부된다 ("전체 허용"이 아니다).
#  * 알 수 없는 필드명, 파싱 실패, 잘못된 값이 있으면 서버가 기동을 거부한다.
#    (오타 난 필드가 조용히 무시되어 금고가 열리는 일이 없어야 한다)
#  * vault ↔ policy 키 목록은 대조하지 않는다 — 기동 시 금고가 잠겨 있다. 정책에 없는 키는
#    fill에서 origin_not_permitted로, 금고에 없는 키는 key_not_found로 드러난다 (감사로그 policy_denied 참조)
# ─────────────────────────────────────────────────────────────


[defaults]

# 승인 정책. 승인은 예외 경로다 — 자동화가 목적이므로 기본은 무승인 통과이고,
# 방어는 allow_origins + expect 대조 + 감사로그가 담당한다.
#   never   — 승인 없이 입력 (기본. origin 화이트리스트가 이미 방어한다)
#   session — 세션당 1회 승인
#   always  — 매번 사람 확인
confirm = "never"

# 값의 수명(메모리)은 키별이 아니라 금고 unlock TTL 하나다 — 서버 환경변수 WALLET_UNLOCK_TTL
# (기본 15m, 홈서버 72h). 만료되면 전부 잠기고 `wallet unlock`으로 다시 연다 (2026-09-02 decided)


# ── 키 정의 ──────────────────────────────────────────────────
#
# [keys."<키 이름>"]
#   type          필수. variants() 생성 방식을 결정한다. 아래 목록 참조
#   allow_origins 필수. 정확한 origin 배열 (scheme + host + port)
#                 ★ fill 대상 요소가 속한 **프레임의 origin**과 대조한다.
#                   카드 필드는 보통 PG사 iframe 안에 있으므로
#                   쇼핑몰이 아니라 PG 도메인을 나열해야 한다.
#   confirm       선택. defaults 덮어쓰기
#   require_selector  선택. fill 대상이 이 CSS 셀렉터에 매치해야 한다.
#                     페이지가 엉뚱한 필드로 유도하는 인젝션에 대한 2차 방어.
#                     마크업 변경에 깨지므로 고위험 키에만 건다
#   require_grant  선택. true면 fill에 grant(FronyShopping pay grant) 필수 —
#                  결제 비밀번호 같은 "돌이킬 수 없는 행위의 열쇠"에 건다
#   input_mode     선택. "text"(기본) | "keypad". keypad는 <input>이 없는 보안 키패드 —
#                  서버가 값의 자릿수마다 숫자 버튼을 눌러 채운다
#   keypad_digit_selector  input_mode="keypad"면 필수(아래 resolver를 쓰지 않을 때). `{digit}` 자리에
#                  숫자를 넣어 버튼을 찾는 CSS 셀렉터. text 모드에 있으면 기동 거부
#   keypad_digit_resolver  숫자가 DOM에 없고 이미지로만 그려지는 스프라이트 키패드. "sprite-template" 하나뿐이며
#                  keypad_key_selector(버튼)·keypad_cell_selector(버튼 안의 스프라이트 셀)와 함께 쓴다.
#                  서버가 셀 이미지를 판독해 자리→숫자를 얻고 버튼을 누른다. keypad_digit_selector와 혼용 불가
#
# type 목록 — 각 타입이 어떤 변형까지 스크럽하는지 결정한다:
#   card    1234-5678-... / 1234 5678 ... / 뒤 4자리 노출 마스킹
#   phone   하이픈·공백·국가코드(+82)·부분 마스킹
#   rrn     하이픈·뒷자리 마스킹
#   email   대소문자·URL 인코딩·앞부분 마스킹
#   name    공백 제거·가운데 마스킹(홍*동)
#   address 공백·줄바꿈 정규화
#   text    평문 + URL/base64 인코딩만 (범용)
#
# origin 매칭은 **정확 일치**다. 와일드카드를 지원하지 않는다 —
# `*.example.com`은 서브도메인 하나만 탈취당해도 전체가 열린다.
# 서브도메인이 여러 개면 명시적으로 나열한다.
#
# 네이밍 (2026-09-06 decided): `범위.항목` 단일값 (profile.phone, passport.number) 또는
# `범위.인스턴스.항목` 여러 개 가능 (card.personal.number / card.corp.number — allow_origins를 다르게 건다).
# 사이트 키는 범위=사이트, 인스턴스=용도: example-shop.login.id, example-shop.payment.pinnumber. 이 두 형태 외에는 GUI가 거부한다
# ─────────────────────────────────────────────────────────────


[keys."card.personal.number"]
type          = "card"
# ★ 쇼핑몰이 아니라 PG 도메인. 실제 도메인은 조사 후 확정할 것
allow_origins = ["https://pay.example-pg.com"]
confirm       = "never"
require_selector = "input[autocomplete='cc-number']"

[keys."card.personal.cvv"]
# 헤드리스 운영이라 사람이 직접 입력하는 안전밸브가 없다 — 완화는 승인 채널(v2)과 unlock TTL뿐
type          = "text"
allow_origins = ["https://pay.example-pg.com"]
confirm       = "never"
# grant는 걸지 않는다 (2026-09-06 decided): grant는 거래 안에서만 발급되는 "결제 실행" 열쇠인데 카드 등록 화면은
# 거래 밖이고 돈이 나가는 행위도 아니다. 남는 방어는 실측 PG origin 정확 일치·unlock TTL·감사로그.
# 승인 채널(v2)이 생기면 cvv·password2에 confirm = "always"를 거는 것이 맞는 자리다

# 결제수단 등록 폼이 함께 묻는 값 (2026-09-06 decided, FWL-041). 가입은 사람이 하고, 그 뒤 카드 등록은 에이전트가
# 채팅 안에서 이 네 키로 채운다. 첫 시도는 PG origin이 여기 없어 origin_not_permitted로 멈추는 게 정상이다 —
# 감사로그 policy_denied {key, origin}의 값을 네 키의 allow_origins에 넣고 다시 시도한다. 카드사 본인인증(ARS·SMS)은
# 사람이 받고 일회성 코드만 에이전트에게 불러 준다
[keys."card.personal.expiry"]
type          = "text"
allow_origins = ["https://pay.example-pg.com"]
confirm       = "never"

[keys."card.personal.password2"]
# 카드 비밀번호 앞 2자리 — CVV와 같은 등급. password 필드에만
type          = "text"
allow_origins = ["https://pay.example-pg.com"]
confirm       = "never"
require_selector = "input[type='password']"

# ── 개인정보 (GUI "개인정보" 섹션의 다섯 항목, profile.* 이름 — 2026-09-06 decided)
# 이름·성별·생년월일은 금고에 두지 않는다 (2026-09-05 decided. 노출돼도 되는 값이라 금고 대상이 아니다).
# 통신사는 같은 기준이면 금고 밖이지만 GUI 한 곳에서 다섯 항목을 함께 관리하려고 남긴다.
# allow_origins = [] 는 "보관만": 등록·목록에는 보이지만 어느 origin에도 넣지 않는다 — 넣을 사이트가 생기면 실측 origin을 추가한다
[keys."profile.rrn"]
type          = "rrn"
allow_origins = []

[keys."profile.phone"]
type          = "phone"
allow_origins = ["https://www.example-shop.com"]

[keys."profile.carrier"]
type          = "text"
allow_origins = []

[keys."profile.email"]
type          = "email"
allow_origins = ["https://www.example-shop.com"]

[keys."profile.address"]
type          = "address"
allow_origins = ["https://www.example-shop.com"]

# ── 여권 — 보관만. 항공·여행 사이트 origin은 실측 후 추가한다
[keys."passport.number"]
type          = "text"
allow_origins = []

[keys."passport.surname"]
type          = "name"
allow_origins = []

[keys."passport.givenname"]
type          = "name"
allow_origins = []

[keys."passport.issue"]
type          = "text"
allow_origins = []

[keys."passport.expiry"]
type          = "text"
allow_origins = []

# ── 사이트 로그인 자격 — 로그인 쿠키가 죽었을 때 에이전트가 로그인 페이지에서 채운다 (2026-09-03 decided:
# 로그인 확인·수행은 에이전트가 instruction으로, 값은 vault 치환이라 컨텍스트에 안 실린다).
# 비밀번호는 password 필드에만 — 페이지가 엉뚱한 칸으로 유도하는 인젝션 2차 방어
[keys."example-shop.login.id"]
type          = "text"
allow_origins = ["https://www.example-shop.com", "https://login.example-shop.com"]

[keys."example-shop.login.password"]
type          = "text"
allow_origins = ["https://www.example-shop.com", "https://login.example-shop.com"]
require_selector = "input[type='password']"

# ── 간편결제 비밀번호 — 결제수단은 사이트에 이미 등록돼 있고 이것만 입력한다.
[keys."example-shop.payment.pinnumber"]
type          = "text"
# 비밀번호 칸은 보통 PG iframe 안에 있다 — ★ PG origin은 추측으로 넣지 않는다. 감사로그 policy_denied {key, origin}에 찍힌 값만 추가한다 (FWL-032)
allow_origins = ["https://www.example-shop.com", "https://pay.example-pg.com"]
# ★ 호출 서비스가 발급한 pay grant가 있어야 채운다 (FWL-022)
require_grant = true
# 보안 키패드 — <input>이 없고 숫자 버튼 클릭이 곧 입력이다. 서버가 금고 값의 자릿수마다 아래 셀렉터({digit}에 숫자를 넣어)
# 버튼을 찾아 누른다. 값은 에이전트에게 가지 않는다 (FWL-033)
input_mode = "keypad"
keypad_digit_selector = "img[role='button'][aria-label='{digit}']"
# 숫자가 스프라이트 이미지로만 그려지는 키패드는 셀렉터 대신 판독기를 쓴다 (FWL-038):
# keypad_digit_resolver = "sprite-template"
# keypad_key_selector = "a.pad-key"
# keypad_cell_selector = "span[class^=pad-pos-]"


# ── origin별 설정 ────────────────────────────────────────────
#
# [origins."<origin>"]
#   amount_selector  결제 금액이 표시되는 CSS 셀렉터.
#                    session_begin의 expect.max_amount와 대조하는 데 쓴다.
#                    ★ 서버가 DOM에서 직접 읽는다. 호출자가 준 값을 믿지 않는다.
#   label            승인 화면에 표시할 사이트 이름
#   browser          이 origin 세션을 띄울 브라우저. "chromium"(기본, headless) | "chrome"(시스템 Chrome)
#   headless         기본 true. false면 화면 있는 브라우저 — interactive 로그온 환경에서만 뜬다 (FWL-018)
#                    세션 = origin 하나(FWL-017)라 둘 다 session_begin에서 확정된다. 호출자는 고르지 못한다.
#
# amount_selector가 있는데 매치 실패면 amount_fallback을 따른다. 없으면 대조하지 않는다 —
# 어느 클릭이 결제인지는 wallet이 판단하지 않는다 (2026-09-02 decided: 그 정보는 별도 쇼핑 관리 서버 몫)
# ─────────────────────────────────────────────────────────────

[approval]
# 대조에 실패했을 때만 사람을 부른다. 아무도 안 누르면 만료되고 실패한다.
# 자동 승인 폴백은 존재하지 않는다.

# 승인 요청 자체의 유효 시간. 이 안에 사람이 안 누르면 거부로 끝난다.
timeout = "5m"

# long-poll 1회의 서버측 상한. HTTP/MCP 클라이언트 타임아웃보다 짧아야 한다.
# 초과하면 still_pending을 반환하고, 호출자가 approval_wait를 다시 부른다.
#
# 대기 프로토콜: 액션은 블로킹하지 않고 토큰을 즉시 반환한다.
#   click(...)              → {status:"pending_approval", token}
#   approval_wait(token)    → 결과 or {status:"still_pending"}
# 토큰으로 몇 번이든 다시 조회할 수 있다 (멱등). 호출자가 재시작해도 이어받는다.
wait_max = "90s"

# 승인 후 실행 직전에 금액을 다시 추출해 대조한다.
# 사람이 몇 분 뒤 승인하는 사이 장바구니나 PG 세션이 바뀔 수 있다.
recheck_before_act = true

# 금액을 추출하지 못한 사이트에서의 동작:
#   deny    — 거부 (안전. 기본값)
#   confirm — 사람에게 물어본다
amount_fallback = "deny"

# expect.max_amount 대비 허용 오차 (배송비·쿠폰 등 소소한 차이 흡수)
amount_tolerance = "3%"

# 승인이 필요해졌을 때의 알림 채널. 이게 없으면 아무도 모르고 타임아웃만 쌓인다.
# 대기 프로토콜보다 이쪽이 실질적 병목이다.
#   page — 승인 페이지에만 표시 (사람이 보고 있어야 함)
#   push      — 폰/데스크탑 푸시 (권장. 채널은 미정)
notify = ["page"]


[origins."https://www.example-shop.com"]
label = "Example Shop"
# amount_selector: 결제 페이지 확인 후 채운다 (없으면 expect 대조 시 amount_fallback=deny)
# 봇 매니저가 헤드리스 chromium을 막는 사이트는 시스템 Chrome 헤드풀로 띄운다 — interactive 로그온 세션이 필요하다 (FWL-027):
# browser  = "chrome"
# headless = false
